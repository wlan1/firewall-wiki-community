# Runtime interface
iface=eth0

# Gateway / protected edge address.
# Use 127.0.0.1 for local Community mode.
gw_ip=127.0.0.1

# Protected service ports.
#
# The runtime automatically detects TCP/UDP traffic for these ports.
# No separate tcp_port or udp_port field is required.
#
# Examples:
# origin_port=80
# origin_port=80,443
# origin_port=80,443,8080
# origin_port=27015,7777
# origin_port=80,443,27015,7777
origin_port=80,8080

# Enable origin protection.
rate_limit=true
